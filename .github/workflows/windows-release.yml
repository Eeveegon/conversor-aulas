name: Windows x64 MSI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2
      - name: Prepare pinned FFmpeg
        shell: pwsh
        run: ./scripts/Get-FFmpeg.ps1
      - name: Test conversions
        shell: pwsh
        run: |
          dotnet run --project tests/ConversorAulas.IntegrationTests -- .
          if ($LASTEXITCODE -ne 0) { throw 'Conversion tests failed.' }
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content src/ConversorAulas.App/ConversorAulas.App.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and app version differ.' }
          if (-not (Test-Path "docs/releases/$env:RELEASE_TAG.md")) { throw 'Release notes missing.' }
      - name: Import signing certificate
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PFX_PASSWORD) { throw 'Signing secrets missing.' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -Password $password -CertStoreLocation Cert:\CurrentUser\My
            $metadata = Get-Content signing/certificate.json -Raw | ConvertFrom-Json
            if ($certificate.Thumbprint -ne $metadata.thumbprint -or -not $certificate.HasPrivateKey) { throw 'Unexpected signing certificate.' }
          } finally {
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
          }
      - name: Build MSI
        shell: pwsh
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: ./scripts/Build-Installer.ps1 -Sign:($env:IS_RELEASE -eq 'true')
      - name: Verify signed release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem artifacts/release/*.msi) + @(Get-Item artifacts/app-win-x64/ConversorAulas.App.exe)
          foreach ($file in $files) {
            ./scripts/Test-CodeSignature.ps1 -Path $file.FullName -RequireTimestamp
          }
      - name: Test install and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem artifacts/release/*.msi)
          if ($installers.Count -ne 1) { throw 'Expected exactly one MSI.' }
          ./scripts/Test-Installer.ps1 -Path $installers[0].FullName -Install
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-msi-${{ github.ref_name }}
          path: |
            artifacts/release/*.msi
            artifacts/release/*.cer
            artifacts/release/SHA256SUMS.txt
            artifacts/release/THIRD-PARTY-NOTICES.md
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem artifacts/release -File | Where-Object { $_.Extension -in @('.msi', '.cer') -or $_.Name -in @('SHA256SUMS.txt', 'THIRD-PARTY-NOTICES.md') } | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "Conversor de Audio de Aulas $env:RELEASE_TAG" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
      - name: Remove signing certificate
        if: always() && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $metadata = Get-Content signing/certificate.json -Raw | ConvertFrom-Json
          $certificatePath = "Cert:\CurrentUser\My\$($metadata.thumbprint)"
          if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath -DeleteKey -Force }
